name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing in this workflow needs write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    # The checks themselves live in gate.yml, shared with release.yml, so the
    # two cannot silently diverge - see that file's header.
    uses: ./.github/workflows/gate.yml
    with:
      python-version: ${{ matrix.python-version }}
