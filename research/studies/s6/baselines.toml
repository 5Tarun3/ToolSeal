# Study 6 baseline survey - 2026-09-17.
#
# Judged against research/studies/s6/baseline-criteria.md, committed before any
# candidate below was examined (commit bc3cd23). No rule was added afterwards.
#
# How candidates were found. Recorded web searches, 2026-09-17:
#   1. "MCP proxy gateway security intercept tool calls open source github"
#   2. "agent framework guardrails tool call middleware human in the loop tool guardrail"
#   3. "open source guardrail library for LLM agents tool call validation runtime policy"
# plus the two runtime systems cited in this project's literature set:
# Fides [P12] and AgentWarden [P14].
#
# Survey boundary. Every repository a search returned directly is recorded
# below, whatever its disposition. Search result summaries were used only to
# nominate candidates; no claim here rests on them. Entries inside a
# curated list (e2b-dev/awesome-mcp-gateways) were NOT expanded, and are named
# here so the boundary is visible rather than silent: agentgateway, Gram
# (speakeasy-api), Kuadrant MCP Gateway, IBM MCP Context Forge, mcpproxy-go,
# MetaMCP, Microsoft MCP Gateway, ToolSDK MCP Registry. Surveying them is a
# deviation, not a correction.
#
# Evidence. Every record rests on primary sources only: GitHub API metadata
# (licence, default-branch commit) and verbatim text from the system's own
# README or documentation, with the snapshot's sha256 and retrieval time, per
# the protocol's snapshotting rule. `evidence` is quoted text, never paraphrase.
#
# criteria_5_6 records whether criteria 5 (installs without an account, API key
# or hosted service) and 6 (runs offline) are *evidenced* for a reproduced
# system. It is a verification status, not an additional criterion. Where it is
# "unverified", the system is reproduced on the evidence of criteria 1-4 and is
# confirmed at install time in T10; a system that fails there is reclassified
# as quoted and the change recorded as a deviation.

