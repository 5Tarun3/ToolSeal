# MITRE ATLAS (Adversarial Threat Landscape for AI Systems), content version
# 2026.09. Technique identifiers and short titles only.
#
# Sourced from the primary distribution rather than the website: MITRE
# publishes authoritative ATLAS data as YAML in the mitre-atlas/atlas-data
# repository, so no secondary corroboration was needed for any title here.
# atlas.mitre.org itself is a JavaScript application and returns only a page
# heading to a fetch, which is why the website is not the source.
#
# Two files in that repository are the wrong ones, and both look right:
#   - dist/ATLAS.yaml is format-version 5.6.0 and declares itself deprecated
#     in its own first line ("no longer being updated with new content").
#   - dist/ATLAS-latest.yaml is a symlink, not data.
# The file read was dist/v6/ATLAS-2026.09.yaml: format-version 6.0.0,
# collection.version "2026.09", modified-date 2026-09-15. Every id and title
# below was copied from it verbatim rather than transcribed from the rendered
# site or from memory.
#
# This file lists a curated subset - 16 entries drawn from the 120 techniques
# and 88 sub-techniques ATLAS 2026.09 publishes - so complete_enumeration is
# left unset (false). A coverage figure computed over this file measures
# coverage of that selection, not of ATLAS as a whole.
#
# The selection rule: a technique is listed when one of this project's 28
# configuration checks bears on it, plus two flagged checkable = false where
# ATLAS names an attack this project deliberately cannot answer from
# configuration. Those two are listed rather than omitted so the gap appears
# in `toolseal policy list` instead of being hidden behind a narrower
# denominator.

id = "mitre-atlas"
kind = "standard"
name = "MITRE ATLAS"
version = "2026.09"
license = "Apache-2.0"
source_url = "https://atlas.mitre.org/"
text_included = false

