# OWASP Top 10 for Agentic Applications (2026), published 2025-12-09 by the
# OWASP GenAI Security Project, Agentic Security Initiative. Identifiers and
# short titles only.
#
# A ranked, incident-grounded Top 10 (ASI01-ASI10) - a separate document from
# the earlier T1-T15 "Agentic AI - Threats and Mitigations" master taxonomy,
# catalogued separately as owasp-agentic-threats. Do not conflate the two:
# T-prefixed ids belong to the taxonomy, ASI-prefixed ids belong to this Top
# 10.
#
# Titles were first drawn up by corroborating four independent secondary
# sources - a WebSearch synthesis, promptfoo.dev, goteleport.com, and
# f5.com - because the primary PDF would not render as text through any
# tooling available at the time. The four agreed on nine of the ten titles
# but left two genuinely open: whether ASI06 was "Memory and Context
# Poisoning" (five sources, including two search-result titles) or, per
# f5.com's one dissenting mention, "Context Management and Retrieval
# Manipulation"; and whether ASI05 carried a trailing "(RCE)" (a 2-2 split
# among the four fetched sources - dropped as not universal).
#
# The project owner has since supplied a primary-source digest
# (docs/superpowers/specs/OWASP_Agentic_Security_Taxonomies.md, a table
# transcribing the published ASI01-ASI10 titles) and every title below was
# reconciled against it character by character. The primary source settles
# both open questions from the secondary-sourced round: ASI06 is "Memory &
# Context Poisoning" (confirming the five-source majority over f5.com's
# dissent), and ASI05 does carry the "(RCE)" suffix, restored here. The
# primary source also uses "&" rather than "and" in ASI02, ASI03 and ASI06;
# those three are corrected to match it exactly. The remaining titles were
# already exact matches. Titles now rest on that primary-source digest, not
# on secondary corroboration.
#
# The document's own resource page identifies it as "for 2026" without
# stating a separate version number on the page as fetched; used "2026" as
# the version, the identifier the document uses for itself, rather than a
# "2.01" update figure that appeared in a single unverified search summary
# and could not be independently confirmed. The primary-source digest does
# not address versioning, so this line is unchanged.

id = "owasp-agentic-top10"
kind = "standard"
name = "OWASP Top 10 for Agentic Applications"
version = "2026"
license = "CC-BY-SA-4.0"
source_url = "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/"
text_included = false
# The full published list (ASI01-ASI10) is enumerated below; items not
# assessable from configuration are flagged checkable = false individually
# rather than omitted, so this catalogue's denominator is the whole standard.
complete_enumeration = true

[[control]]
id = "ASI01"
title = "Agent Goal Hijack"
checkable = false            # a runtime input-manipulation attack, not a config property

[[control]]
id = "ASI02"
title = "Tool Misuse & Exploitation"

[[control]]
id = "ASI03"
title = "Identity & Privilege Abuse"

[[control]]
id = "ASI04"
title = "Agentic Supply Chain Vulnerabilities"

[[control]]
id = "ASI05"
title = "Unexpected Code Execution (RCE)"

[[control]]
id = "ASI06"
title = "Memory & Context Poisoning"
checkable = false            # a runtime memory/retrieval attack, not a config property

[[control]]
id = "ASI07"
title = "Insecure Inter-Agent Communication"

[[control]]
id = "ASI08"
title = "Cascading Failures"
checkable = false            # a systemic runtime property, not assessable from static config

[[control]]
id = "ASI09"
title = "Human-Agent Trust Exploitation"
checkable = false            # a social-engineering concern, outside a project's config

[[control]]
id = "ASI10"
title = "Rogue Agents"
checkable = false            # runtime agent behaviour, not a config property
