# OWASP Agentic AI threat taxonomy: "Agentic AI - Threats and Mitigations"
# v1.0 (Feb 2025), OWASP GenAI Security Project, Agentic Security Initiative.
# Identifiers and short titles only.
#
# This is the master T1-T15 threat taxonomy, not the ranked ASI01-ASI10 "Top
# 10 for Agentic Applications" OWASP published later (Dec 2025) - that is a
# separate document, catalogued separately as owasp-agentic-top10. This file
# was originally shipped under the id owasp-agentic-top10 before that
# distinction was drawn; the id was corrected to owasp-agentic-threats so it
# no longer collides with the actual Top 10 document's name.
#
# Titles were first drawn up by corroborating three independent secondary
# sources (a HumanSecurity blog post, a Pipelab.org article, and a
# third-party GitHub mapping doc that itself noted it did not guarantee
# OWASP's exact wording), because the OWASP resource page would not render
# as text through any tooling available at the time. That round got 13 of
# 15 titles right; T10's hyphenation and T11's wording ("Unexpected RCE and
# Code Attacks" vs a fuller spelled-out variant) were genuinely unsettled
# by secondary sources alone, and T6-T9 were normalized from the sources'
# "&" to "and" for house style rather than because of any source
# disagreement.
#
# The project owner has since supplied a primary-source digest
# (docs/superpowers/specs/OWASP_Agentic_Security_Taxonomies.md, a table
# transcribing the published T1-T15 titles) and every title below was
# reconciled against it character by character. The primary source uses
# "&" rather than "and" in T6, T7, T8 and T9; those four are corrected here
# to match it exactly rather than kept in the catalogue's own house style.
# T10, T11 and the remaining ten titles were already exact matches. Titles
# now rest on that primary-source digest, not on secondary corroboration.

id = "owasp-agentic-threats"
kind = "standard"
name = "OWASP Agentic AI Threats"
version = "1.0"
license = "CC-BY-SA-4.0"
source_url = "https://genai.owasp.org/resource/agentic-ai-threats-and-mitigations/"
text_included = false
# The full published list (T1-T15) is enumerated below; items not assessable
# from configuration are flagged checkable = false individually rather than
# omitted, so this catalogue's denominator is the whole standard.
complete_enumeration = true

[[control]]
id = "T1"
title = "Memory Poisoning"
checkable = false            # a runtime memory attack, not a config property

[[control]]
id = "T2"
title = "Tool Misuse"

[[control]]
id = "T3"
title = "Privilege Compromise"

[[control]]
id = "T4"
title = "Resource Overload"

[[control]]
id = "T5"
title = "Cascading Hallucination Attacks"
checkable = false            # a model-output/runtime property, not a config one

[[control]]
id = "T6"
title = "Intent Breaking & Goal Manipulation"
checkable = false            # a runtime planning behaviour, not a config property

[[control]]
id = "T7"
title = "Misaligned & Deceptive Behaviors"
checkable = false            # a runtime behaviour, not a config property

[[control]]
id = "T8"
title = "Repudiation & Untraceability"

[[control]]
id = "T9"
title = "Identity Spoofing & Impersonation"

[[control]]
id = "T10"
title = "Overwhelming Human in the Loop"
