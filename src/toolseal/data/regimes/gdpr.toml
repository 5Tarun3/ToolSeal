# General Data Protection Regulation - Regulation (EU) 2016/679.
#
# EUR-Lex, the official EU law portal. EU-owned editorial content, summaries
# and consolidated texts are licensed CC BY 4.0 (Commission Decision
# 2011/833/EU; the EUR-Lex legal notice). Article and recital numbers and
# short paraphrases only - GDPR text itself is not reproduced here, the same
# discipline the OWASP/NIST/ISO catalogues in src/toolseal/data/standards/
# follow.
#
# source_url verified 2026-08-18 by fetching
# https://eur-lex.europa.eu/eli/reg/2016/679/oj directly: confirmed as
# Regulation (EU) 2016/679, the current consolidated version (04/05/2016,
# "in force"), not a superseded document. Article numbers below (6, 12-23,
# 25, 28, 30, 32, 33-34, 35, 44-49) were confirmed present in that fetch.
#
# GDPR's core security obligation, Article 32, is explicitly risk-based:
# measures must be "appropriate to the risk", taking into account "the state
# of the art, the costs of implementation ... the nature, scope, context and
# purposes of processing". That is unlike HIPAA's unqualified "Required"
# technical safeguards (45 CFR 164.312) or DORA's unconditional "shall have
# in place" language (Arts. 9-10). This file therefore raises no baseline
# severity: a flat raise needs a flat mandate, and GDPR's own text declines
# to give one for anything this taxonomy checks. D1 is restated at its
# existing severity purely for traceability to Art. 32(1)(b) - it is not a
# raise, and [severity] carries no other entries for exactly that reason.

id = "gdpr"
kind = "regime"
name = "General Data Protection Regulation (EU) 2016/679"
source = "Regulation (EU) 2016/679, Arts. 5, 6, 12-23, 25, 28, 30, 32-35, 44-49"
source_url = "https://eur-lex.europa.eu/eli/reg/2016/679/oj"
license = "CC-BY-4.0"

[scope]
# Printed with every report produced under this profile (spec §5). None of
# these is something a configuration file can attest to - each is a legal
# judgment, a signed agreement, a documented procedure, or an act that
# happens outside any file toolseal reads.
not_assessed = [
  "lawful basis for processing (Art. 6)",
  "data processing agreements with processors (Art. 28)",
  "data subject rights procedures - access, rectification, erasure, portability (Arts. 12-23)",
  "data protection impact assessments (Art. 35)",
  "records of processing activities (Art. 30)",
  "breach notification to the supervisory authority and to data subjects (Arts. 33-34)",
  "international transfers relying on adequacy decisions or standard contractual clauses as legal instruments (Arts. 44-49)",
]

[severity]
# Already critical at baseline. Restated for traceability to Art. 32(1)(b)
# (the ability to ensure ongoing confidentiality of processing systems) -
# not a raise. See the file header for why GDPR's risk-qualified drafting
# does not support an actual raise here or anywhere else in this file.
D1 = "critical"

[require]
# Art. 5(1)(f) (integrity and confidentiality principle) names "accidental
# or unlawful destruction or damage" as a risk this principle exists to
# guard against. An approval gate on destructive tool operations is a direct
# configuration control against exactly that risk.
"policy.approval_required_for_destructive" = true
